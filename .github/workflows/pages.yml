# Deploys site/ (the reCode product page) to GitHub Pages, served at
# recode.thesolidchain.com. Actions-based Pages deployment (not classic
# branch-deploy) because the site lives in site/, not repo root or /docs —
# the only two folders classic branch-deploy supports. Mirrors the
# thesolidchain.com repo's pages.yml.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
